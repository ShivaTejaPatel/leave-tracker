docker-build:
  stage: docker-build
  tags: 
    - local
  dependencies:
    - maven-build
  needs:
    - maven-build
  before_script:
    - docker login -u "$DOCKER_HUB_USERNAME" -p "$DOCKER_HUB_PASSWORD"
  script:
    - echo "Building Docker image with commit hash tag ${DOCKER_TAG_COMMIT}"
    - docker build -t ${DOCKER_IMAGE}:${DOCKER_TAG_COMMIT} .
    - docker tag ${DOCKER_IMAGE}:${DOCKER_TAG_COMMIT} ${DOCKER_IMAGE}:${DOCKER_TAG_LATEST}
    - echo "Image tagged as ${DOCKER_IMAGE}:${DOCKER_TAG_COMMIT} and ${DOCKER_IMAGE}:${DOCKER_TAG_LATEST}"
    # Save image as tarball for Trivy scanning
    - docker save -o image.tar ${DOCKER_IMAGE}:${DOCKER_TAG_COMMIT}
    - echo "Docker image saved as tarball"
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  only:
    - dev


trivy-scan:
  stage: trivy-scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - docker-build
  needs:
    - docker-build
  script:
    - mkdir -p reports
    - echo "Running Trivy vulnerability scan on image tarball"
    - |
      trivy image \
        --input image.tar \
        --format table \
        --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
        --exit-code 0 \
        --no-progress \
        --scanners vuln \
        --output reports/trivy-report.txt
    - |
      trivy image \
        --input image.tar \
        --format json \
        --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
        --exit-code 0 \
        --no-progress \
        --scanners vuln \
        --output reports/trivy-report.json
    - echo "Trivy scan completed successfully"
    - echo "Reports saved to reports/ directory"
  artifacts:
    paths:
      - reports/
    expire_in: 1 hour
    when: always
  allow_failure: false
  only:
    - dev


docker-push:
  stage: docker-push
  tags: 
    - local
  dependencies:
    - docker-build
  needs:
    - docker-build
    - trivy-scan
  before_script:
    - echo ${DOCKER_HUB_PASSWORD} | docker login -u ${DOCKER_HUB_USERNAME} --password-stdin
  script:
    - echo "Pushing Docker image with commit hash tag ${DOCKER_TAG_COMMIT}"
    - docker push ${DOCKER_IMAGE}:${DOCKER_TAG_COMMIT}
    - docker push ${DOCKER_IMAGE}:${DOCKER_TAG_LATEST} || (echo ${DOCKER_HUB_PASSWORD} | docker login -u ${DOCKER_HUB_USERNAME} --password-stdin && docker push ${DOCKER_IMAGE}:${DOCKER_TAG_LATEST})
    - echo "Successfully pushed ${DOCKER_IMAGE}:${DOCKER_TAG_COMMIT} and ${DOCKER_IMAGE}:${DOCKER_TAG_LATEST}"
  only:
    - dev

helm-update:
  stage: helm-update
  image:
    name: alpine/git:latest
    entrypoint: [""]
  dependencies: []
  needs:
    - docker-push
  before_script:
    - apk add --no-cache yq git curl jq
    - git config --global user.email "gitlab-ci@example.com"
    - git config --global user.name "GitLab CI"
  script:
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - yq eval ".image.tag = \"${DOCKER_TAG_COMMIT}\"" -i kubernetes-manifests/helm-chart/values.yaml
    - git add kubernetes-manifests/helm-chart/values.yaml
    - git commit -m "Update image tag to ${DOCKER_TAG_COMMIT} [skip ci]" || true
    - git push origin HEAD:${CI_COMMIT_REF_NAME} || true
    # Create or update MR
    - |
      MR_RESPONSE=$(curl -s --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${CI_COMMIT_REF_NAME}&target_branch=${CI_DEFAULT_BRANCH}&state=opened")
      MR_ID=$(echo "$MR_RESPONSE" | jq -r 'if type=="array" and length>0 then .[0].iid else empty end')
      if [ -z "$MR_ID" ] || [ "$MR_ID" = "null" ]; then
        echo "Creating new MR..."
        curl -s --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
          --data "source_branch=${CI_COMMIT_REF_NAME}" \
          --data "target_branch=${CI_DEFAULT_BRANCH}" \
          --data "title=Update Helm Chart Image Tag ${DOCKER_TAG_COMMIT}" \
          --data "description=Automated update of Helm chart image tag to ${DOCKER_TAG_COMMIT}" \
          --data "remove_source_branch=false" || echo "Failed to create MR"
        echo "MR created successfully."
      else
        echo "MR #${MR_ID} already exists. Updating it..."
        curl -s --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" -X PUT "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_ID}" \
          --data "title=Update Helm Chart Image Tag ${DOCKER_TAG_COMMIT}" \
          --data "description=Automated update of Helm chart image tag to ${DOCKER_TAG_COMMIT}" || echo "Failed to update MR"
        echo "MR #${MR_ID} updated successfully."
      fi
  only:
    - dev
