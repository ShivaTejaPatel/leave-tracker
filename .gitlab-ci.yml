stages:
  - maven-build
 # - sonarqube
  - docker-build
  - trivy-scan
  - docker-push
  - helm-update

cache:
  paths:
    - .m2/repository

variables:
  DOCKER_IMAGE: ${DOCKER_HUB_USERNAME}/${IMAGE_NAME}
  DOCKER_TAG_COMMIT: ${CI_COMMIT_SHORT_SHA}
  DOCKER_TAG_LATEST: latest
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

maven-build:
  stage: maven-build
  image: maven:3-eclipse-temurin-17
  script:
    - mvn clean package -B -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
  only:
    - dev

