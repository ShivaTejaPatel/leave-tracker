apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: leave-tracker-monitor
  namespace: leavetracking  
  labels:
    release: monitoring     
spec:
  selector:
    matchLabels:
      app: leave-tracker    
  endpoints:
  - port: 8005            
    path: /actuator/prometheus  
    interval: 15s         